[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/mmazzieri/balancecraft"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
balancecraft-model = { path = "crates/model" }
balancecraft-engine = { path = "crates/engine" }
balancecraft-file = { path = "crates/file" }
balancecraft-ui-egui = { path = "crates/ui-egui" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
sha2 = "0.10"
tempfile = "3"
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "persistence"] }
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }
